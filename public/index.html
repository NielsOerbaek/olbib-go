<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Olbib Go: lydbøger fra biblioteket</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Olbib Go">
  <meta name="theme-color" content="#D6E6FF">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preload" href="/fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="top">
    <button id="back" class="round-btn" aria-label="Tilbage" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <a id="brand" href="#/"><img src="/icon-180.png" alt=""><span>Olbib Go</span></a>
    <h1 id="title" hidden></h1>
  </header>
  <main id="view"></main>

  <nav id="dock" hidden>
    <a href="#/" data-tab="loans"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4z"/><path d="M15.5 5.2l3.8-1 3.7 14.6-3.8 1z"/></svg><span>Mine lån</span></a>
    <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Søg</span></a>
    <a href="#/account" data-tab="account"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.2-7 8-7s7 2.5 8 7"/></svg><span>Konto</span></a>
  </nav>
  <div id="mini" hidden>
    <img id="mini-cover" alt="">
    <button id="mini-open" class="mini-text"><span id="mini-title"></span><span id="mini-time"></span></button>
    <button id="mini-toggle" class="mini-play" aria-label="Afspil"></button>
  </div>
  <div id="sheet" hidden></div>
  <audio id="audio" preload="none" playsinline></audio>
  <div id="toast" role="status" hidden></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
