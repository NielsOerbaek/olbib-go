
    query getManifestationsByFaust($faust: [String!]!) {
  manifestations(faust: $faust) {
    pid
    audience {
      childrenOrAdults {
        code
      }
    }
    ownerWork {
      ...WorkTeaserSearchPage
    }
  }
}
    fragment ManifestationCover on Manifestation {
  pid
  cover {
    thumbnail
    xSmall {
      url
      width
      height
    }
    small {
      url
      width
      height
    }
    medium {
      url
      width
      height
    }
    large {
      url
      width
      height
    }
  }
}
fragment ManifestationIdentifiers on Manifestation {
  pid
  identifiers {
    type
    value
  }
}
fragment ManifestationAccess on Manifestation {
  accessTypes {
    code
    display
  }
  access {
    __typename
    ... on AccessUrl {
      origin
      url
      loginRequired
    }
    ... on RetrieverService {
      id
    }
    ... on InterLibraryLoan {
      loanIsPossible
    }
    ... on Ereol {
      origin
      url
      canAlwaysBeLoaned
    }
    ... on DigitalArticleService {
      issn
    }
  }
}
fragment ManifestationDetails on Manifestation {
  physicalDescription {
    summaryFull
  }
  dateFirstEdition {
    display
  }
  edition {
    publicationYear {
      display
      year
    }
    edition
    summary
  }
  genreAndForm
  publisher
  contributors {
    display
  }
  contributorsFromDescription
}
fragment ManifestationMaterialTypes on Manifestation {
  materialTypes {
    materialTypeGeneral {
      code
      display
    }
    materialTypeSpecific {
      code
      display
    }
  }
}
fragment ManifestationSearchPageTeaser on Manifestation {
  ...ManifestationAccess
  ...ManifestationMaterialTypes
  ...ManifestationIdentifiers
  ...ManifestationCover
  ...ManifestationDetails
}
fragment WorkMaterialTypes on Work {
  materialTypes {
    materialTypeGeneral {
      display
      code
    }
    materialTypeSpecific {
      display
      code
    }
  }
}
fragment WorkTitles on Work {
  titles {
    full
    original
  }
}
fragment WorkCreators on Work {
  creators {
    display
    __typename
  }
}
fragment WorkPublicationYear on Work {
  workYear {
    display
  }
}
fragment WorkTeaserSearchPage on Work {
  workId
  ...WorkTitles
  ...WorkCreators
  ...WorkMaterialTypes
  ...WorkPublicationYear
  manifestations {
    all {
      ...ManifestationSearchPageTeaser
    }
    bestRepresentation {
      ...ManifestationSearchPageTeaser
    }
  }
}